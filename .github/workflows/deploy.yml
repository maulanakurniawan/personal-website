name: Deploy to Server

on:
  push:
    branches:
      - main

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ---------- Backend build on runner ----------
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          tools: composer:v2
          extensions: mbstring, intl, pdo_mysql, bcmath, gd, curl, zip
          coverage: none

      - name: Composer install
        run: |
          composer install \
            --no-dev \
            --prefer-dist \
            --optimize-autoloader \
            --no-interaction \
            --no-progress

      # ---------- Frontend build on runner ----------
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Build frontend
        run: |
          npm ci
          npm run build

      # ---------- SSH setup ----------
      - name: Prepare SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_KEY }}" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      - name: Add server to known_hosts
        run: |
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts

      # ---------- Rsync ----------
      - name: Sync files to server
        env:
          SSH_CMD: ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes
        run: |
          rsync -az --delete \
            -e "$SSH_CMD" \
            --exclude ".git" \
            --exclude ".github" \
            --exclude ".env" \
            --exclude "node_modules" \
            --exclude "storage" \
            --exclude "bootstrap/cache" \
            --exclude "setup_vps.sh" \
            ./ \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/var/www/${{ secrets.DEPLOY_USER }}/"

      # ---------- Remote Laravel commands ----------
      - name: Run remote deploy commands
        env:
          SSH_CMD: ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes
        run: |
          $SSH_CMD "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" << 'EOF'
          set -euo pipefail

          APP_DIR="/var/www/${{ secrets.DEPLOY_USER }}"
          cd "$APP_DIR"

          mkdir -p \
            storage/framework/cache/data \
            storage/framework/sessions \
            storage/framework/views \
            storage/logs \
            bootstrap/cache

          # Do not run chown here. Ownership was configured once on the server.
          find storage bootstrap/cache -type d -exec chmod 2775 {} \;
          find storage bootstrap/cache -type f -exec chmod 664 {} \;

          php artisan down --refresh=15 || true

          bring_app_up() {
            php artisan up || true
          }

          trap bring_app_up EXIT

          php artisan optimize:clear
          php artisan migrate --force

          php artisan config:cache
          php artisan route:cache
          php artisan view:cache

          php artisan queue:restart || true
          php artisan paddle:sync-plans || true

          php artisan up
          trap - EXIT
          EOF